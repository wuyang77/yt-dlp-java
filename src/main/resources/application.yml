# =====================================================
# Spring Boot 应用配置
# =====================================================
server:
  port: 8080

spring:
  application:
    name: yt-dlp-java
  servlet:
    encoding:
      charset: UTF-8
      force: true
  output:
    ansi:
      enabled: ALWAYS

# 使用 ANSI 颜色区分日志级别，同时保留 ISO-8601 时间和可检索字段
logging:
  level:
    root: INFO
    "[org.wuyang.ytdlp]": INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level){level} %clr([%thread]){cyan} %clr(%logger{36}){magenta} - %msg%n"

# =====================================================
# yt-dlp-java 业务配置
# =====================================================
ytdlp:
  # 输出目录
  output:
    dir: F:/HH学习资料/全套/1-福利/12-youtbue下载
    template: "%(title)s [%(resolution)s].%(ext)s"

  # yt-dlp 相关路径
  bin:
    yt-dlp: src/main/resources/yt-dlp.exe
    ffmpeg: src/main/resources/ffmpeg.exe
    cookies: src/main/resources/cookies.txt
    node: D:/dev/nvm/nodejs/node.exe

  # PO Token Provider
  pot:
    path: src/main/resources/bgutil-pot.exe
    port: 49300
    download-url: https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest/download/bgutil-pot-windows-x86_64.exe

  # HTTP 头
  http:
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    referer: https://www.youtube.com/

  # YouTube 客户端策略（按优先级排列）
  youtube:
    # web_creator 需要账号 Cookie；GVS PO Token 由 bgutil HTTP Provider 自动获取
    clients: web_creator,web_embedded,tv,tv_downgraded,android_vr
    # 并发探测客户端数量；建议 3-4，过高可能触发 YouTube 限流
    parallelism: 4

  # 下载参数
  download:
    retries: 3
    fragment-retries: 10
    http-retries: 10
    http-chunk-size: 10
    force-ipv4: true

  # 本地音轨语种识别（Whisper.cpp）；需自行安装 whisper-cli 并下载 ggml 模型
  speech-recognition:
    whisper-cli: whisper-cli
    model: ""
    parallelism: 2
    sample-seconds: 12
